services:
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: fastfreela_web
    ports:
      - "8080:80"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - appnet

  db:
    image: mysql:8.0
    container_name: mysql_db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fast-freela
      MYSQL_USER: web-app
      MYSQL_PASSWORD: lc9y&3W0U5~N
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - appnet

volumes:
  dbdata:

networks:
  appnet:
    driver: bridge
